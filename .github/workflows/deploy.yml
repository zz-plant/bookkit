name: Deploy

# Publishes books to Cloudflare Workers once CI has passed on a push to main.
#
# Off until the repository sets the DEPLOY_BOOKS variable (Settings → Secrets
# and variables → Actions → Variables) to the books to publish, separated by
# spaces ("on-call running-hot"), or to --all. Forks do not inherit variables,
# so a fork publishes nothing, not even with its own token, until it names its
# own books. With DEPLOY_BOOKS set, a missing CLOUDFLARE_API_TOKEN secret
# fails the run instead of passing with nothing published.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A CI run that passed on a push to this repository's main, or a manual
    # run started on main. Pull request runs, including ones from a fork's
    # branch named main, never reach the secrets.
    if: >-
      vars.DEPLOY_BOOKS != '' && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # It verifies, builds, and checks the books as governance-and-tests does
    # (3 to 5 minutes), then uploads them.
    timeout-minutes: 30
    env:
      DEPLOY_BOOKS: ${{ vars.DEPLOY_BOOKS }}
      # The commit CI passed, not whatever main points to by now.
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check DEPLOY_BOOKS and the Cloudflare token
        env:
          # Whether the secret exists; the token itself stays out of this step.
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          for word in $DEPLOY_BOOKS; do
            case "$word" in
              --all) ;;
              -*)
                echo "::error title=DEPLOY_BOOKS::\"$word\" is not a book. DEPLOY_BOOKS lists book names separated by spaces, or --all."
                exit 1
                ;;
            esac
          done
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=No Cloudflare token::DEPLOY_BOOKS is \"$DEPLOY_BOOKS\" but the CLOUDFLARE_API_TOKEN secret is missing, so nothing was published. Add the secret under Settings → Secrets and variables → Actions, or delete DEPLOY_BOOKS to turn deploys off."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      # Runs finish in the order CI finishes, which is not always commit order.
      # Publishing an older commit after a newer one would roll the site back.
      - name: Skip a commit main has moved past
        id: current
        run: |
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main" != "$COMMIT" ]; then
            echo "::notice title=Not deployed::main is at ${main:0:12}, past ${COMMIT:0:12}; the run for ${main:0:12} publishes it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.current.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.current.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      # The same link-preview cache as CI (see ci.yml). Restored from main's
      # own runs only: caches saved by pull requests are not visible here.
      - name: Cache link-preview images
        if: steps.current.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: apps/*/node_modules/.cache/bookkit-og
          key: bookkit-og-${{ hashFiles('packages/astro-bookkit/src/seo/og-image.ts', 'packages/astro-bookkit/src/seo/og-render.ts', 'bun.lock') }}-${{ github.run_id }}
          restore-keys: bookkit-og-${{ hashFiles('packages/astro-bookkit/src/seo/og-image.ts', 'packages/astro-bookkit/src/seo/og-render.ts', 'bun.lock') }}-

      # Everything that runs dependency code happens here, without the token:
      # verify --all, each book's build, check:build, and wrangler's dry run.
      # Each book that passes is stamped with this commit.
      - name: Verify, build, and check every book (no token)
        if: steps.current.outputs.skip != 'true'
        run: bun run bookkit deploy $DEPLOY_BOOKS --dry-run

      # Publishes exactly the stamped dist/ the step above checked; deploy
      # refuses one from another commit or changed since.
      - name: Publish
        if: steps.current.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run bookkit deploy $DEPLOY_BOOKS --no-build
