name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One list of checks for CI and contributors: scripts/lib/verify-plan.ts.
      # Findings with a file also annotate the PR (see scripts/verify.ts).
      - name: Verify (every gate)
        run: bun run verify -- --all
