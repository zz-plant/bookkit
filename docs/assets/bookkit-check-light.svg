<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
<title id="title">bookkit check rejects a broken toolkit action</title>
<desc id="desc">Terminal output. grep shows the tool file sets mechanism: root-cause-analysis and timeboxMinutes: 45. bun run bookkit check reports two errors, a timebox over 10 minutes and a mechanism the book does not define, each with a fix, and exits with code 1.</desc>
<style>
@font-face{font-family:'BK Fragment Mono';src:url(data:font/woff;base64,) format('woff');}
text{font-family:'BK Fragment Mono', ui-monospace, Menlo, monospace;font-size:13px}
</style>
<rect x="0.5" y="0.5" width="879" height="329" rx="2" fill="#f7f4ed" stroke="#d4d1cb"/>
<text y="40" xml:space="preserve"><tspan x="22.23" fill="#a09d97">$ </tspan><tspan x="38.30" fill="#1d1b17">grep -E '^(mechanism|timeboxMinutes):' apps/on-call/src/content/book/toolkit/find-root-cause.mdx</tspan></text>
<text y="61" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">mechanism: root-cause-analysis</tspan></text>
<text y="82" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">timeboxMinutes: 45</tspan></text>
<text y="115" xml:space="preserve"><tspan x="22.23" fill="#a09d97">$ </tspan><tspan x="38.30" fill="#1d1b17">bun run bookkit check apps/on-call/src/content/book/toolkit/find-root-cause.mdx</tspan></text>
<text y="136" xml:space="preserve"><tspan x="22.23" fill="#a09d97">$ bun run scripts/bookkit.ts check apps/on-call/src/content/book/toolkit/find-root-cause.mdx</tspan></text>
<text y="157" xml:space="preserve"></text>
<text y="178" xml:space="preserve"><tspan x="22.23" fill="#a3301c">✗</tspan><tspan x="30.27" fill="#1d1b17"> apps/on-call/src/content/book/toolkit/find-root-cause.mdx (tool in on-call): 2 finding(s)</tspan></text>
<text y="199" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">  </tspan><tspan x="38.30" fill="#a3301c">error:</tspan><tspan x="86.50" fill="#1d1b17"> Action primitive timebox error: Action primitives must be executable in &lt;= 10 minutes</tspan></text>
<text y="220" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">    </tspan><tspan x="54.37" fill="#6b6964">fix:</tspan><tspan x="86.50" fill="#1d1b17"> Set timeboxMinutes to 10 or less, splitting the tool into smaller tools if it needs more time.</tspan></text>
<text y="241" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">  </tspan><tspan x="38.30" fill="#a3301c">error:</tspan><tspan x="86.50" fill="#1d1b17"> Tool references unknown mechanism "root-cause-analysis"</tspan></text>
<text y="262" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">    </tspan><tspan x="54.37" fill="#6b6964">fix:</tspan><tspan x="86.50" fill="#1d1b17"> Use one of this book's mechanism slugs (bounded-escalation, incident-triage, minimal-repro-doc,</tspan></text>
<text y="283" xml:space="preserve"><tspan x="22.23" fill="#1d1b17">         rollback-first-change), or add mechanisms/root-cause-analysis.mdx first.</tspan></text>
<text y="304" xml:space="preserve"><tspan x="22.23" fill="#6b6964">error: script "bookkit" exited with code 1</tspan></text>
</svg>
