name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check:types

      - name: Check Separation
        run: bun run check:separation

      - name: Check Architecture Doc
        run: bun run check:architecture

      - name: Check TODOs
        run: bun run check:todos

      - name: Check Shims
        run: bun run check:shims

      - name: Validate All Books
        run: bun run validate

      - name: Run Tests
        run: bun run test
