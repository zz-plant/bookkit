name: Bug
description: The compiler, a check, a book's site, or a command does something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran or the page you opened, and what it did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or check finding, verbatim.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`bun --version`, and the commit (`git rev-parse --short HEAD`)."
