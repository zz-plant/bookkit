<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-labelledby="title desc">
<title id="title">How a book compiles</title>
<desc id="desc">The author's intent (book.config.ts), the author's content (src/content/book/), and proposals from agents and analyzers each stop at the compiler gates: contract, separation, corpus, and build. What passes becomes the artifacts: the read UI, PDF and EPUB, the MCP endpoint, and a coverage matrix for runbook books.</desc>
<style>
@font-face{font-family:'BK Newsreader Medium';src:url(data:font/woff;base64,) format('woff');}
@font-face{font-family:'BK Fragment Mono';src:url(data:font/woff;base64,) format('woff');}
text{font-kerning:normal}
</style>
<rect x="0.5" y="0.5" width="879" height="403" rx="2" fill="#f7f4ed" stroke="#d4d1cb"/>
<text x="162.66666666666669" y="54" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">the author decides</text>
<text x="162.66666666666669" y="86" font-family="'BK Newsreader Medium', Georgia, serif" font-size="24" fill="#1d1b17" text-anchor="middle">Intent</text>
<text x="162.66666666666669" y="112" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#1d1b17" text-anchor="middle">book.config.ts</text>
<line x1="162.66666666666669" y1="128" x2="162.66666666666669" y2="167" stroke="#6b6964" stroke-width="1.25"/>
<path d="M158.16666666666669 161 L162.66666666666669 168 L167.16666666666669 161" fill="none" stroke="#6b6964" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
<text x="440.00000000000006" y="54" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">the author writes</text>
<text x="440.00000000000006" y="86" font-family="'BK Newsreader Medium', Georgia, serif" font-size="24" fill="#1d1b17" text-anchor="middle">Content</text>
<text x="440.00000000000006" y="112" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#1d1b17" text-anchor="middle">src/content/book/</text>
<line x1="440.00000000000006" y1="128" x2="440.00000000000006" y2="167" stroke="#6b6964" stroke-width="1.25"/>
<path d="M435.50000000000006 161 L440.00000000000006 168 L444.50000000000006 161" fill="none" stroke="#6b6964" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
<text x="717.3333333333334" y="54" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">agents and analyzers propose</text>
<text x="717.3333333333334" y="86" font-family="'BK Newsreader Medium', Georgia, serif" font-size="24" fill="#1d1b17" text-anchor="middle">Proposals</text>
<text x="717.3333333333334" y="112" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12.5" fill="#1d1b17" text-anchor="middle">MCP, check:suggestions, propose</text>
<line x1="717.3333333333334" y1="128" x2="717.3333333333334" y2="167" stroke="#6b6964" stroke-width="1.25" stroke-dasharray="3 3"/>
<path d="M712.8333333333334 161 L717.3333333333334 168 L721.8333333333334 161" fill="none" stroke="#6b6964" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="40" y1="172" x2="840" y2="172" stroke="#a3301c" stroke-width="2"/>
<text x="40" y="198" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#a3301c" text-anchor="start">compiler gates</text>
<text x="840" y="198" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="end">bun run verify; CI runs verify --all</text>
<text x="134" y="236" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">Contract</text>
<text x="134" y="258" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">each file, field by field</text>
<text x="338" y="236" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">Separation</text>
<text x="338" y="258" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">content stays data</text>
<text x="542" y="236" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">Corpus</text>
<text x="542" y="258" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">one meaning per mechanism</text>
<text x="746" y="236" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">Build</text>
<text x="746" y="258" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">dist/ passes check:build</text>
<line x1="440" y1="276" x2="440" y2="313" stroke="#6b6964" stroke-width="1.25"/>
<path d="M435.5 307 L440 314 L444.5 307" fill="none" stroke="#6b6964" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>
<text x="134" y="346" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">Read UI</text>
<text x="134" y="368" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">a static site in dist/</text>
<text x="338" y="346" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">PDF and EPUB</text>
<text x="338" y="368" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">the book and each chapter</text>
<text x="542" y="346" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">MCP endpoint</text>
<text x="542" y="368" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">/api/mcp.json</text>
<text x="746" y="346" font-family="'BK Newsreader Medium', Georgia, serif" font-size="19" fill="#1d1b17" text-anchor="middle">Coverage matrix</text>
<text x="746" y="368" font-family="'BK Fragment Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#6b6964" text-anchor="middle">runbook books</text>
</svg>
