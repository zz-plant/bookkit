name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fails on a high or critical advisory in bun.lock; `bun audit` lists the
  # moderate and low ones. Reads the lockfile, so it needs no install.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Audit dependencies
        run: bun audit --audit-level=high

  governance-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Link-preview images are cached by content (seo/og-render.ts), so a
      # build re-renders only the cards whose page changed. The key changes
      # with the renderer and its fonts, which start a fresh cache.
      - name: Cache link-preview images
        uses: actions/cache@v4
        with:
          path: apps/*/node_modules/.cache/bookkit-og
          key: bookkit-og-${{ hashFiles('packages/astro-bookkit/src/seo/og-image.ts', 'packages/astro-bookkit/src/seo/og-render.ts', 'bun.lock') }}-${{ github.run_id }}
          restore-keys: bookkit-og-${{ hashFiles('packages/astro-bookkit/src/seo/og-image.ts', 'packages/astro-bookkit/src/seo/og-render.ts', 'bun.lock') }}-

      # One list of checks for CI and contributors: scripts/lib/verify-plan.ts.
      # Findings with a file also annotate the PR (see scripts/verify.ts).
      - name: Verify (every gate)
        run: bun run verify -- --all

      # The deploy path end to end, publishing nothing: deploy runs verify
      # --all itself, builds and checks every book, then runs wrangler's dry
      # run. The guard put in wrangler's place fails any call without
      # --dry-run and records each call, so the step can check that every
      # book reached wrangler with this commit as its version message.
      - name: Deploy every book (dry run)
        run: |
          bin=node_modules/.bin
          mv "$bin/wrangler" "$bin/wrangler-real"
          cat > "$bin/wrangler" <<'GUARD'
          #!/bin/sh
          case " $* " in
            *" --dry-run "*) ;;
            *) echo "wrangler guard: refusing \"wrangler $*\" without --dry-run" >&2; exit 1 ;;
          esac
          echo "$(basename "$PWD") $*" >> "$RUNNER_TEMP/wrangler-calls"
          exec "$(dirname "$0")/wrangler-real" "$@"
          GUARD
          chmod +x "$bin/wrangler"
          bun run bookkit deploy --all --dry-run
          books=$(($(ls apps/*/wrangler.jsonc | wc -l)))
          tagged=$(($(grep -c -- "deploy --dry-run --message $(git rev-parse --short=12 HEAD) " "$RUNNER_TEMP/wrangler-calls")))
          echo "Books that reached wrangler with this commit's version message: $tagged of $books"
          test "$tagged" -eq "$books"

  # axe-core over one page of each type in every book, and the home page with
  # each panel open, in light and dark at desktop and phone widths
  # (scripts/check-a11y.ts). Fails on serious or critical violations. Its own
  # job, so it runs beside the gates instead of after them.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Name the Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("playwright/package.json").version)')" >> "$GITHUB_OUTPUT"

      # Each Playwright version pins one Chromium build, so the version names
      # the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}

      # Downloads Chromium only when the cache missed; the system libraries it
      # needs are installed either way.
      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      # The link-preview images governance-and-tests saves (see above); this
      # job only reads them.
      - name: Restore link-preview images
        uses: actions/cache/restore@v4
        with:
          path: apps/*/node_modules/.cache/bookkit-og
          key: bookkit-og-${{ hashFiles('packages/astro-bookkit/src/seo/og-image.ts', 'packages/astro-bookkit/src/seo/og-render.ts', 'bun.lock') }}-${{ github.run_id }}
          restore-keys: bookkit-og-${{ hashFiles('packages/astro-bookkit/src/seo/og-image.ts', 'packages/astro-bookkit/src/seo/og-render.ts', 'bun.lock') }}-

      - name: Accessibility (every book)
        run: bun run check:a11y

  # The meaning pass of check:corpus, which verify leaves out (it compares
  # wording only): mechanisms in different books that say the same thing in
  # other words. The embedding model (about 550 MB) is cached between runs.
  semantic-corpus:
    runs-on: ubuntu-latest
    env:
      BOOKKIT_MODEL_CACHE: ${{ github.workspace }}/../bookkit-models
      BOOKKIT_DOWNLOAD_MODEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Name the embedding model
        id: model
        run: |
          id="$(bun -e 'import { DEFAULT_EMBEDDING_MODEL_KEY, EMBEDDING_MODELS } from "./scripts/lib/embed-text.ts"; console.log(EMBEDDING_MODELS[DEFAULT_EMBEDDING_MODEL_KEY].id)')"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ env.BOOKKIT_MODEL_CACHE }}
          key: embedding-model-${{ steps.model.outputs.id }}

      # check:corpus falls back to wording when the model cannot load, so the
      # step also fails unless the meaning pass ran.
      - name: Mechanisms across books, by meaning
        run: |
          bun run check:corpus -- --mode error | tee "$RUNNER_TEMP/corpus.txt"
          if ! grep -q "semantic pass: " "$RUNNER_TEMP/corpus.txt"; then
            echo "::error title=Meaning pass did not run::check:corpus compared wording only; the reason is in its output above."
            exit 1
          fi

  # A project made the way packages/create-bookkit/README.md says, outside the
  # repository, must install, build, pass its own verify, and reach the
  # publish step of its deploy.
  standalone-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scaffold a standalone project
        run: bun run packages/create-bookkit/src/index.ts "$RUNNER_TEMP/field-notes" --title "Field Notes"

      # deploy publishes from a commit, so the project is committed first.
      - name: Install, build, verify, and deploy (dry run)
        working-directory: ${{ runner.temp }}/field-notes
        run: |
          bun install
          git init --quiet
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit --quiet -m "Field Notes"
          bun run build
          bun run verify -- --all
          bun run deploy -- --dry-run
